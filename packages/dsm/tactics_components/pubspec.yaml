name: tactics_components
description: Design System — Betclic brand tokens, fonts and atomic components.
version: 0.0.1

environment:
  flutter: ">=3.27.0"
  sdk: ">=3.11.0 <4.0.0"
resolution: workspace

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  givn:
  shouldly: ^0.5.0+1

flutter:
  assets:
    - assets/icons/
    - assets/nav/
  fonts:
    - family: Betclic
      fonts:
        - asset: assets/fonts/Betclic.ttf
    # ponytail: the variable font covers the weights; "Betclic Expanded" falls back
    #           to Betclic. Add the design's static Expanded .ttf files for full fidelity.
    - family: Betclic Expanded
      fonts:
        - asset: assets/fonts/Betclic.ttf
