name: tic_tac_toe_workspace
description: Tic-tac-toe — Flutter architecture template (Betclic flutter-front architecture).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.11.0 <4.0.0"

# Dart pub workspace: every app and every package resolve their deps together.
workspace:
  - apps/*
  - packages/**/*

dev_dependencies:
  melos: ^7.3.0
  very_good_analysis: ^6.0.0

melos:
  name: tic_tac_toe_workspace

  scripts:
    analyze:
      # The analysis server crashes when several `dart analyze` runs go in parallel
      # (same workaround as in prod): concurrency of 1 by default, overridable via
      # MELOS_ANALYZE_CONCURRENCY.
      run: dart run melos exec -c ${MELOS_ANALYZE_CONCURRENCY:-1} -- dart analyze .
      description: Static analysis across the whole workspace.

    test:
      run: dart run melos exec -c 1 --dir-exists=test -- flutter test
      description: Runs the tests of every package that has some.

    generate:
      run: dart run melos exec --depends-on=build_runner -- dart run build_runner build
      description: Generates code (riverpod, freezed, auto_route, theme_tailor).

    format:
      # Generated code is left unformatted (as in prod): build_runner writes it at
      # its own width, and reformatting to 120 would make it diverge on every codegen.
      # `bricks/` is excluded too: those are mustache templates, not valid Dart.
      run: |
        # The list is materialised first: an empty result must NOT reach `dart format`
        # with no path, or it would format the whole cwd (same guard as in prod).
        FORMAT_FILES=$(find apps packages -type f -name "*.dart" \
          -not -path "*/.dart_tool/*" \
          -not -path "*/build/*" \
          -not -name "*.freezed.dart" \
          -not -name "*.g.dart" \
          -not -name "*.gr.dart" \
          -not -name "*.mocks.dart" \
          -not -name "*.tailor.dart")

        if [ -n "$FORMAT_FILES" ]; then printf '%s\n' "$FORMAT_FILES" | xargs dart format; fi
      description: Formats the source code (120 columns, generated code excluded).
