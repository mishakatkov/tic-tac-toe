name: tic_tac_toe
description: Demo app — tic-tac-toe (architecture template).
version: 1.0.0+1
publish_to: none

environment:
  flutter: ">=3.27.0"
  sdk: ">=3.11.0 <4.0.0"
resolution: workspace

dependencies:
  app_providers:
  app_router:
  # auto_route uses Cupertino transitions on iOS, which reference its glyphs.
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.2.1
  riverpod: ^3.2.1
  tactics_providers:

dev_dependencies:
  flutter_test:
    sdk: flutter
  givn:
  shouldly: ^0.5.0+1

flutter:
  uses-material-design: true
