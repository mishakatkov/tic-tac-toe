name: data
description: Scaffolds a data layer matching the Betclic conventions (data source, DTO, mapper, provider quadruplet).
version: 0.1.0+0

environment:
  mason: ">=0.1.0 <0.2.0"

vars:
  name:
    type: string
    description: Package name (snake_case), e.g. match_detail_data.
    default: my_feature_data
    prompt: Package name?
  classname:
    type: string
    description: Feature name (snake_case), e.g. match_detail.
    default: my_feature
    prompt: Feature name?
  domainPackage:
    type: string
    description: Name of the domain package whose contracts this layer implements.
    default: my_feature_domain
    prompt: Domain package name?
