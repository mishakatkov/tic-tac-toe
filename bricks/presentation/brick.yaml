name: presentation
description: Scaffolds a presentation layer matching the Betclic conventions (screen, routing, theme_tailor theme, provider triplet).
version: 0.1.0+0

environment:
  mason: ">=0.1.0 <0.2.0"

vars:
  name:
    type: string
    description: Package name (snake_case), e.g. match_detail_presentation.
    default: my_feature_presentation
    prompt: Package name?
  classname:
    type: string
    description: Feature name (snake_case), e.g. match_detail.
    default: my_feature
    prompt: Feature name?
  domainPackage:
    type: string
    description: Name of the domain package this screen consumes.
    default: my_feature_domain
    prompt: Domain package name?
