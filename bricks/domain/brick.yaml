name: domain
description: Scaffolds a domain layer matching the Betclic conventions (entities, contracts, behaviors, provider triplet).
version: 0.1.0+0

environment:
  mason: ">=0.1.0 <0.2.0"

vars:
  name:
    type: string
    description: Package name (snake_case), e.g. match_detail_domain.
    default: my_feature_domain
    prompt: Package name?
  classname:
    type: string
    description: Feature name (snake_case), e.g. match_detail.
    default: my_feature
    prompt: Feature name?
